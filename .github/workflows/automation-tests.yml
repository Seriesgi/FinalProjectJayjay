name: Automation Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: |
          chmod +x gradlew
          ./gradlew apiTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-cucumber-report
          path: reports/cucumber/api.*

  web-tests:
    name: Web UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: |
          chmod +x gradlew
          ./gradlew webTest -Dheadless=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-cucumber-report
          path: reports/cucumber/web.*
